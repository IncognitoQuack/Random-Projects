<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoomFlex Viewer</title>
    <link rel="icon" href="https://cdn1.iconfinder.com/data/icons/science-technology-colors/91/Science__Technology_39-512.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #333;
            color: white;
            overflow-x: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative; 
        }

        #transferSection {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        #transferButton {
            background: #9890901a;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 40px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 0.9rem;
            margin-right: 6px;
        }
        #transferButton:hover {
            background: #80818070;
        }

        #transferOptions {
            display: none;
            margin-top: 10px;
            text-align: right;
            margin-right: 10px;
        }
        #exportBtn, #importBtn {
            background: #777;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 0.8rem;
        }
        #exportBtn:hover, #importBtn:hover {
            background: #999;
        }

        #mediaList {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .media-wrapper {
            position: relative;
        }

        .media-wrapper img,
        .media-wrapper video {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .media-wrapper iframe {
            max-width: 720px;
            height: 600px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #dropArea {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 10px;
        }

        #mediaUrl {
            margin-top: 20px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-family: math;
            border-radius: 3px;
        }

        #zoomControls {
            display: none;
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
        }

        #zoomControls button {
            display: block;
            margin: 10px 0;
            padding: 10px;
            font-size: 18px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #zoomControls button:hover {
            background: #45a049;
        }

        .hide-button {
            display: none;
            margin: 10px 0;
            padding: 10px;
            font-size: 18px;
            background: #f44336;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .hide-button:hover {
            background: #e53935;
        }

        #magnifier {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #magnifier img {
            max-width: 80%;
            max-height: 80%;
            transition: transform 0.3s ease;
            transform: scale(1);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        #popupControls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
        }
        #popupControls button {
            margin: 0 10px;
            padding: 10px;
            font-size: 18px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        #popupControls button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="transferSection">
            <button id="transferButton">Transfer</button>
            <div id="transferOptions">
                <button id="exportBtn">Export</button>
                <button id="importBtn">Import</button>
            </div>
        </div>

        <div id="dropArea">
            <p><b>Drag and drop an image here or</b> 
               <b id="clickToSelect">click to select</b>
            </p>
        </div>
        <input type="text" id="mediaUrl" placeholder="Enter media URL">
        <div id="mediaList"></div>
        <button style="background-color: #333; color: #000000; padding: 0; border: none;" id="oneSizeChange">.</button>
    </div>

    <div id="zoomControls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">-</button>
        <button class="hide-button" id="hideButton">𝕩</button>
        <button id="magnifyButton">MI</button>
    </div>

    <div id="magnifier">
        <img src="" alt="Magnified Image">
        <div id="popupControls">
            <button id="popupZoomIn">+</button>
            <button id="popupZoomOut">-</button>
            <button id="popupClose">Close</button>
        </div>
    </div>

    <script>
        const mediaUrlInput = document.getElementById('mediaUrl');
        const dropArea = document.getElementById('dropArea');
        const mediaList = document.getElementById('mediaList');
        const clickToSelect = document.getElementById('clickToSelect');
        const zoomControls = document.getElementById('zoomControls');
        const zoomInButton = document.getElementById('zoomIn');
        const zoomOutButton = document.getElementById('zoomOut');
        const hideButton = document.getElementById('hideButton');
        const magnifyButton = document.getElementById('magnifyButton');
        const magnifier = document.getElementById('magnifier');
        const popupImage = magnifier.querySelector('img');
        const popupControls = document.getElementById('popupControls');
        const popupZoomIn = document.getElementById('popupZoomIn');
        const popupZoomOut = document.getElementById('popupZoomOut');
        const popupClose = document.getElementById('popupClose');
        const oneSizeChange = document.getElementById('oneSizeChange');

        // Transfer Section
        const transferButton = document.getElementById('transferButton');
        const transferOptions = document.getElementById('transferOptions');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');

        let currentImage = null;
        let scale = 1;
        let isResized = false;

        transferButton.addEventListener('click', () => {
            if (transferOptions.style.display === 'none') {
                transferOptions.style.display = 'block';
            } else {
                transferOptions.style.display = 'none';
            }
        });

        // DRAG & DROP for images/videos & also for JSON import
        dropArea.addEventListener('dragenter', preventDefault);
        dropArea.addEventListener('dragover', preventDefault);
        dropArea.addEventListener('drop', handleDrop);

        // PASTE FROM CLIPBOARD
        clickToSelect.addEventListener('click', pasteFromClipboard);

        // ENTER KEY for URL input
        mediaUrlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const url = mediaUrlInput.value.trim();
                addMediaByUrl(url);
            }
        });

        // ZOOM IN/OUT
        zoomInButton.addEventListener('click', function() {
            if (currentImage) {
                scale += 0.1;
                currentImage.style.transform = 'scale(' + scale + ')';
            }
        });
        zoomOutButton.addEventListener('click', function() {
            if (currentImage && scale > 0.1) {
                scale -= 0.1;
                currentImage.style.transform = 'scale(' + scale + ')';
            }
        });

        // HIDE BUTTON
        hideButton.addEventListener('click', function() {
            if (currentImage) {
                currentImage.parentElement.style.display = 'none';
                zoomControls.style.display = 'none';
                currentImage = null;
            }
        });

        // MAGNIFY
        magnifyButton.addEventListener('click', function() {
            if (currentImage) {
                magnifier.style.display = 'flex';
                popupControls.style.display = 'flex';
                popupImage.src = currentImage.src;
                popupImage.style.transform = 'scale(1)';
                scale = 1; // Reset scale
            }
        });

        // POPUP ZOOM
        popupZoomIn.addEventListener('click', function() {
            scale += 0.1;
            popupImage.style.transform = 'scale(' + scale + ')';
        });
        popupZoomOut.addEventListener('click', function() {
            if (scale > 0.1) {
                scale -= 0.1;
                popupImage.style.transform = 'scale(' + scale + ')';
            }
        });
        popupClose.addEventListener('click', function() {
            magnifier.style.display = 'none';
            popupControls.style.display = 'none';
            scale = 1;
        });

        // TOGGLE SIZE
        oneSizeChange.addEventListener('click', function() {
            const mediaElements = mediaList.querySelectorAll('img, video');
            isResized = !isResized;
            for (const mediaElement of mediaElements) {
                if (isResized) {
                    mediaElement.style.width = '500px';
                    mediaElement.style.height = '500px';
                } else {
                    mediaElement.style.width = 'auto';
                    mediaElement.style.height = 'auto';
                }
            }
        });

        // PREVENT DEFAULT DRAG EVENTS
        function preventDefault(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // HANDLE DROP
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();

            // Check if it's a file (image/video/JSON)
            const file = e.dataTransfer.files[0];
            if (!file) return;

            // If it's JSON import, parse
            if (file.type === 'application/json') {
                importGalleryFile(file);
                return;
            }

            // IMAGE or VIDEO
            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');
            if (isImage || isVideo) {
                addMedia(file, isImage, isVideo);
            } else {
                alert('Please drop a valid image, video, or a JSON file.');
            }
        }

        // CLIPBOARD
        function pasteFromClipboard() {
            navigator.clipboard.read().then(data => {
                for (const item of data) {
                    if (item.types.includes('image/png') || item.types.includes('image/jpeg') || item.types.includes('image/webp')) {
                        // webp support also
                        item.getType('image/png').then(blob => {
                            if (blob) addMedia(blob, true, false);
                        });
                        item.getType('image/jpeg').then(blob => {
                            if (blob) addMedia(blob, true, false);
                        });
                        item.getType('image/webp').then(blob => {
                            if (blob) addMedia(blob, true, false);
                        });
                    }
                }
            });
        }

        // ADD MEDIA VIA URL
        function addMediaByUrl(url) {
            if (url) {
                const isImage = url.match(/\.(jpeg|jpg|gif|png|webp)$/i);
                const isVideo = url.match(/\.(mp4)$/i);

                if (isImage || isVideo) {
                    const mediaElement = createMedia(url, isImage, isVideo);
                    mediaList.insertBefore(mediaElement, mediaList.firstChild);
                } else {
                    // Assume it's an iframe link
                    const mediaElement = createIframe(url);
                    mediaList.insertBefore(mediaElement, mediaList.firstChild);
                }
                mediaUrlInput.value = '';
            }
        }

        function addMedia(file, isImage, isVideo) {
            const objectURL = URL.createObjectURL(file);
            const mediaElement = createMedia(objectURL, isImage, isVideo);
            mediaList.insertBefore(mediaElement, mediaList.firstChild);
        }

        // CREATE MEDIA WRAPPER
        function createMedia(src, isImage, isVideo) {
            const mediaWrapper = document.createElement('div');
            mediaWrapper.className = 'media-wrapper';
            if (isImage) {
                const mediaElement = document.createElement('img');
                mediaElement.src = src;
                mediaElement.addEventListener('click', function() {
                    toggleZoomControls(mediaElement);
                });
                mediaWrapper.appendChild(mediaElement);
            } else if (isVideo) {
                const mediaElement = document.createElement('video');
                mediaElement.src = src;
                mediaElement.setAttribute('autoplay', true);
                mediaElement.setAttribute('loop', true);
                mediaElement.setAttribute('muted', true);
                mediaElement.setAttribute('controls', false);
                mediaElement.addEventListener('click', function() {
                    toggleZoomControls(mediaElement);
                });
                mediaWrapper.appendChild(mediaElement);
            }
            return mediaWrapper;
        }

        // CREATE IFRAME
        function createIframe(src) {
            const iframeElement = document.createElement('iframe');
            iframeElement.src = src;
            iframeElement.style.width = '720px';
            iframeElement.style.height = '600px';
            return iframeElement;
        }

        // TOGGLE ZOOM CONTROLS
        function toggleZoomControls(mediaElement) {
            currentImage = mediaElement;
            scale = 1; // Reset scale
            mediaElement.style.transform = 'scale(1)';
            zoomControls.style.display = 'block';
        }

        // CLICK OUTSIDE TO HIDE ZOOM CONTROLS
        document.body.addEventListener('click', function(event) {
            if (!event.target.closest('.media-wrapper') && !event.target.closest('#zoomControls')) {
                zoomControls.style.display = 'none';
                currentImage = null;
            }
        });

        exportBtn.addEventListener('click', exportGallery);
        importBtn.addEventListener('click', () => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'application/json';
            fileInput.onchange = function() {
                if (fileInput.files[0]) {
                    importGalleryFile(fileInput.files[0]);
                }
            };
            fileInput.click();
        });

        async function exportGallery() {
            // Array of objects representing each item
            const items = Array.from(mediaList.children).reverse(); 
            let exportData = [];

            for (const item of items) {
                const media = item.querySelector('img, video, iframe');
                if (!media) continue;

                if (media.tagName.toLowerCase() === 'img') {
                    const base64String = await toBase64(media.src);
                    exportData.push({ type: 'image', data: base64String });
                } else if (media.tagName.toLowerCase() === 'video') {
                    // Convert video src to base64 (could be large!)
                    const base64String = await toBase64(media.src);
                    exportData.push({ type: 'video', data: base64String });
                } else if (media.tagName.toLowerCase() === 'iframe') {
                    // iframe remains just a URL
                    exportData.push({ type: 'iframe', data: media.src });
                }
            }

            // Create JSON
            const jsonData = JSON.stringify({ gallery: exportData }, null, 2);
            downloadJson(jsonData, 'zoomflex_export.json');
        }

        // Convert blob or data URL to base64 via fetch (if not already base64)
        async function toBase64(src) {
            // If it's already a dataURL, return it as-is
            if (src.startsWith('data:')) {
                return src;
            }
            // Otherwise, fetch the blob and convert
            const response = await fetch(src);
            const blob = await response.blob();
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        // Utility to download JSON
        function downloadJson(jsonStr, filename) {
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        // IMPORT GALLERY FILE
        function importGalleryFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const obj = JSON.parse(e.target.result);
                    if (!obj.gallery) {
                        alert('Invalid JSON format: missing "gallery" field.');
                        return;
                    }
                    importGalleryData(obj.gallery);
                } catch (err) {
                    alert('Error parsing JSON: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function importGalleryData(galleryArray) {
            // For each item in order, create the media
            galleryArray.forEach(item => {
                if (item.type === 'image') {
                    const mediaWrapper = createMedia(item.data, true, false);
                    mediaList.insertBefore(mediaWrapper, mediaList.firstChild);
                } else if (item.type === 'video') {
                    const mediaWrapper = createMedia(item.data, false, true);
                    mediaList.insertBefore(mediaWrapper, mediaList.firstChild);
                } else if (item.type === 'iframe') {
                    const iframe = createIframe(item.data);
                    mediaList.insertBefore(iframe, mediaList.firstChild);
                }
            });
        }
    </script>
</body>
</html>
